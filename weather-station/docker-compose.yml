services:

  postgres:
    image: postgres:17

    container_name: weather-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: weather
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  mosquitto:
    image: eclipse-mosquitto

    container_name: weather-mqtt

    restart: unless-stopped

    ports:
      - "1883:1883"
      - "9001:9001"

volumes:
  postgres_data: